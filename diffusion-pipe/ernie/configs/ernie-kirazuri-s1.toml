# trained using diffusion-pipe commit 928bd6c866035ee7040bc39cf1f358abd1008b20
# NCCL_P2P_DISABLE="1" NCCL_IB_DISABLE="1" NCCL_CUMEM_ENABLE="0" deepspeed --num_gpus=1 train.py --deepspeed --config local_config/ernie-kirazuri-s1.toml

output_dir = '/home/vega/training_output/ernie-kirazuri-s1'

dataset = 'local_config/ernie-kirazuri-dataset-s1.toml'

# training settings
epochs = 2
# Per-resolution batch sizes
micro_batch_size_per_gpu = 16
pipeline_stages = 1
gradient_accumulation_steps = 1
gradient_clipping = 1
# warmup ~10% of 37,400 total optimizer steps
warmup_steps = 3700
lr_scheduler = 'cosine'

# misc settings
save_every_n_epochs = 1
activation_checkpointing = true

partition_method = 'parameters'

save_dtype = 'bfloat16'
caching_batch_size = 2
map_num_proc = 8
steps_per_print = 1
compile = true

[model]
type = 'ernie_image'
diffusion_model = '/home/vega/workspace/ComfyUI/models/diffusion_models/ernie-image.safetensors'
vae = '/home/vega/workspace/ComfyUI/models/vae/flux2-vae.safetensors'
text_encoders = [
    {path = '/home/vega/workspace/ComfyUI/models/text_encoders/ministral-3-3b.safetensors', type = 'flux2'}
]
dtype = 'bfloat16'
timestep_sample_method = 'logit_normal'
shift = 3

[optimizer]
type = 'adamw8bitkahan'
lr = 6e-6
betas = [0.9, 0.99]
weight_decay = 0.01
stabilize = false